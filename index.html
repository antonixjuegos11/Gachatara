<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha RPG | Lobby Principal</title>
    <!-- Fuentes Gamer Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fondo Animado de Partículas -->
    <canvas id="particles-canvas"></canvas>

    <!-- BANNER SUPERIOR DE NAVEGACIÓN -->
    <header class="top-header">
        <div class="logo-title">
            <span class="game-tag">GACHATARA</span>
        </div>
        <nav class="nav-bar">
            <button class="nav-tab active" onclick="switchTab('lobby')">Lobby</button>
            <button class="nav-tab" onclick="switchTab('invocacion')">Invocación</button>
            <button class="nav-tab" onclick="switchTab('dex')">Dex</button>
        </nav>
    </header>

    <!-- ZONA CENTRAL DEL LOBBY -->
    <main id="tab-lobby" class="lobby-container tab-content active">
        <!-- Panel Central de Presentación -->
        <div class="hero-frame">
            <div class="hero-overlay"></div>
            
            <div class="hero-content">
                <span class="badge-status">SISTEMA LISTO</span>
                <h1 class="lobby-title">Gachatara</h1>
                <p class="lobby-subtitle">Selecciona tu modo de juego para desplegar la unidad.</p>
                
                <!-- Botón de Combate (Deshabilitado) -->
                <div class="battle-btn-wrapper">
                    <button class="btn-battle disabled" disabled>
                        <span class="btn-glitch"></span>
                        <span class="btn-text">¡A LUCHAR!</span>
                        <span class="btn-subtext">PRÓXIMAMENTE</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- ZONA DE INVOCACIÓN (GACHA) -->
    <main id="tab-invocacion" class="lobby-container tab-content">
        <div class="gacha-frame">
            <h2 class="gacha-banner-title">BANNER KANTO GEN 1</h2>
            <p class="gacha-subtitle">¡Involucra Pokémon de 1ª Generación y Megaevoluciones Secretas!</p>
            
            <div class="gacha-buttons">
                <button class="btn-pull" onclick="pullGacha(1)">Tirada x1 (1 Ticket)</button>
                <button class="btn-pull multi" onclick="pullGacha(10)">Tirada x10 (10 Tickets)</button>
            </div>

            <!-- RESULTADOS DE TIRADAS -->
            <div id="gacha-results" class="results-grid"></div>
        </div>
    </main>

    <!-- ZONA DE COLECCIÓN (DEX) -->
<main id="tab-dex" class="lobby-container tab-content">
    <div class="dex-frame">
        <div class="dex-header">
            <h2 class="dex-title">POKÉDEX KANTO</h2>
            <div class="dex-progress-wrapper">
                <span id="dex-counter">0 / 151 (0%)</span>
                <div class="progress-bar-bg">
                    <div id="dex-progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <!-- Grid donde se pintan los 151 Pokémon -->
        <div id="dex-grid" class="dex-grid"></div>
    </div>
</main>

    <!-- Carga de Scripts en Orden -->
    <script src="db.js"></script>
    <script src="gacha.js"></script>
    <script src="game.js"></script>
</body>
</html>
